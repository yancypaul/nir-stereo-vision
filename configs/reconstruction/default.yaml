# ==============================================================================
# 通用双目立体视觉与 3D 点云重建配置 (Universal Stereo Reconstruction Config)
# ==============================================================================
# 使用指南:
# 1. 平时只需按需修改本文件中的路径和参数；
# 2. 在根目录下运行终端命令: python run_reconstruction.py
# 3. 产出的 3D 点云 (.ply) 可直接拖入 CloudCompare 进行观察和测量。
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 输入数据配置 (Input Images)
# ------------------------------------------------------------------------------
input:
  # 待测双目图像路径 (支持 .png, .jpg)
  left_image: "data/hik_left.png"
  right_image: "data/hik_right.png"
  
  # 自动左右目反转检测 (真实标定双目已有固定左右目对应关系，设为 false)
  auto_detect_lr_swap: false

# ------------------------------------------------------------------------------
# 2. 标定与极线校正模式 (Calibration Mode)
# ------------------------------------------------------------------------------
calibration:
  mode: "file"  # 使用刚才解算出的超高精度标定文件

  # [模式 B] mode == "file" 时生效:
  param_file: "configs/calibration/stereo_calib_params.json"

  # [模式 A] mode == "ideal" (备用)
  focal_length_px: 2548.0
  baseline_m: 0.0601

  # [模式 C] mode == "auto_board" (备用)
  board_left_dir: "data/calibration_images/left"
  board_right_dir: "data/calibration_images/right"
  pattern_size: [11, 8]
  square_size_mm: 20.0

# ------------------------------------------------------------------------------
# 3. 立体匹配算法核心参数 (Stereo Matcher: SGBM-HH 或 GREAT-Stereo)
# ------------------------------------------------------------------------------
matcher:
  # 匹配引擎类型: "sgbm" (传统CPU高保真) 或 "great" (ICCV 2025 SOTA 深度神经网络)
  type: "sgbm"

  # [GREAT-Stereo 深度学习引擎配置] (当 type == "great" 时生效):
  checkpoint_path: "../GREAT-Stereo/checkpoints/great-igev-middlebury-submit.pth"
  great_repo_path: "../GREAT-Stereo"
  device: "cuda"              # "cuda" 或 "cpu"
  iters: 22                   # GRU 视差循环更新轮数 (兼顾精度与速度)
  auto_downsample_4gb: true   # 针对 GTX 1650Ti (4GB) 开启显存保护 (下采样推理后双线性插值复原)
  mixed_precision: true       # 开启 fp16 混合精度显存优化

  # [传统 SGBM 算法配置] (当 type == "sgbm" 时生效):
  # 真实相机视差搜索总宽 (基线 60mm, 焦距约 2550px, 1~2m 工作距离视差约 80~160px)
  num_disparities: 192

  # 最小视差搜索起点 (真实平行校正后视差严格非负，设为 0)
  min_disparity: 0

  # 匹配块尺寸 (5 抗噪好，几何形态扎实稳定)
  block_size: 5

  # 匹配模式: "HH" 为全向 8 方向平滑 (无条纹)
  mode: "HH"

  # WLS 边缘保持平滑滤波 (原版高保真参数，边缘硬挺锐利，绝无拉扯扭曲)
  wls_filter: true
  wls_lambda: 8000.0          # 原始经典刚度
  wls_sigma: 1.5              # 原始高锐利度，严格保边，防止前后景边缘外溢扭曲

  # 辅助防错过滤
  disp12_max_diff: 1          # 左右一致性最大允许视差差值
  uniqueness_ratio: 10        # 唯一性比率 (滤除歧义匹配)
  speckle_window_size: 100    # 斑点噪声滤波窗口
  speckle_range: 2            # 斑点最大允许差值

# ------------------------------------------------------------------------------
# 4. 三维点云与后处理 (3D Point Cloud Post-processing)
# ------------------------------------------------------------------------------
pointcloud:
  # 深度有效范围截断 (米)
  min_depth_m: 0.5            # 覆盖近处 0.5 米起的物体
  max_depth_m: 5.0            # 扩大到 5.0 米，完整保留圆凳(2.3~3m)与后排柜子(3~4.5m)
  
  # 统计离群点去噪 (SOR, Statistical Outlier Removal)
  remove_outliers: true
  outlier_nb_neighbors: 30    # 考量的邻域点数
  outlier_std_ratio: 1.2      # 标准差倍数阈值 (越小去噪越激进)

  # 法向量估计 (在 CloudCompare 中显示时拥有逼真的光影凹凸感)
  estimate_normals: true

# ------------------------------------------------------------------------------
# 5. 统一输出中心 (Unified Output Center: hk_real_output)
# ------------------------------------------------------------------------------
output:
  # 所有点云(.ply)、深度图、视差图、灰度引导图、全景诊断大图统一存入此文件夹
  output_dir: "data/output/hk_real_output"
  
  # 是否开启时间戳自动累积命名 (如 model_20260922_161500.ply, depth_20260922_161500.png)
  # 开启后每次运行自动生成独立时间戳文件，绝不覆盖或删除之前的历史产物！
  timestamp_accumulate: true
  
  # 自动生成包含极线对齐、视差图、3D俯视图的多合一监控大图
  generate_preview: true
